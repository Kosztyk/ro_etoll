name: Publish RO eToll v1.0.2
on:
  workflow_run:
    workflows:
      - Validate RO eToll
    types:
      - completed
permissions:
  contents: write
jobs:
  publish:
    name: Publish after successful main validation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish validated v1.0.2 once
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$CURRENT_SHA" != "$VALIDATED_SHA" ]]; then
            echo "main advanced since validation; skipping release."
            exit 0
          fi
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ro_etoll/manifest.json"))["version"])')"
          if [[ "$VERSION" != "1.0.2" ]]; then
            echo "Workflow limited to v1.0.2."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$VALIDATED_SHA" \
            --title "RO eToll v$VERSION" \
            --notes-file RELEASE_NOTES_1.0.2.md \
            --latest
